name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'kaceper11/monocode'
    needs: [linux, linux-rpm, windows, host]
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Prepare optional Apple notarization key
        id: apple_signing
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" || -z "${APPLE_CERTIFICATE:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_P8:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "Apple notarization credentials are not configured; building an ad-hoc-signed macOS artifact."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF)"
            exit 1
          fi
          node - "$TAG" <<'NODE'
          const { readFileSync } = require("node:fs");
          const version = process.argv[2];
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp(
            `^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`,
            "m",
          );
          if (!heading.test(readFileSync("CHANGELOG.md", "utf8"))) {
            console.error(`CHANGELOG.md has no valid release section for ${version}`);
            process.exit(1);
          }
          NODE

      - name: Write release config
        env:
          APPLE_SIGNING_CONFIGURED: ${{ steps.apple_signing.outputs.configured }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const identity = process.env.APPLE_SIGNING_CONFIGURED === "true"
            ? (process.env.APPLE_SIGNING_IDENTITY || "").trim()
            : "-";
          const pubkey = process.env.TAURI_UPDATER_PUBKEY || "";
          const endpoint = "https://github.com/kaceper11/monocode/releases/latest/download/latest.json";
          if (!pubkey) {
            console.error("TAURI_UPDATER_PUBKEY is required");
            process.exit(1);
          }
          writeFileSync(
            process.env.RUNNER_TEMP + "/tauri.release.conf.json",
            JSON.stringify(
              {
                bundle: {
                  createUpdaterArtifacts: true,
                  macOS: { signingIdentity: identity },
                },
                plugins: {
                  updater: {
                    pubkey,
                    endpoints: [endpoint],
                  },
                },
              },
              null,
              2,
            ),
          );
          NODE

      - name: Build signed macOS packages
        if: steps.apple_signing.outputs.configured == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"
          npx tauri build --target x86_64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"

      - name: Build ad-hoc-signed macOS packages
        if: steps.apple_signing.outputs.configured != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"
          npx tauri build --target x86_64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/tauri.release.conf.json"

      - name: Verify macOS package architectures and signatures
        run: |
          set -euo pipefail
          verify_app() {
            local app="$1"
            local expected_arch="$2"
            local executable
            local actual_arch
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            actual_arch=$(lipo -archs "$app/Contents/MacOS/$executable")
            if [[ "$actual_arch" != "$expected_arch" ]]; then
              echo "Expected $app to contain only $expected_arch, got: $actual_arch" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
          }
          verify_app "target/aarch64-apple-darwin/release/bundle/macos/MonoCode.app" arm64
          verify_app "target/x86_64-apple-darwin/release/bundle/macos/MonoCode.app" x86_64

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: target/release/bundle/linux

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: target/release/bundle/nsis

      - name: Download Linux rpm package
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm-package
          path: target/release/bundle/rpm

      - name: Download host packages
        uses: actions/download-artifact@v4
        with:
          name: host-packages
          path: build/host-packages

      - name: Stage GitHub release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="target/release/bundle"
          ARM_BUNDLE="target/aarch64-apple-darwin/release/bundle"
          INTEL_BUNDLE="target/x86_64-apple-darwin/release/bundle"
          shopt -s nullglob
          ARM_TARS=("$ARM_BUNDLE"/macos/*.app.tar.gz)
          ARM_DMGS=("$ARM_BUNDLE"/dmg/*.dmg)
          INTEL_TARS=("$INTEL_BUNDLE"/macos/*.app.tar.gz)
          INTEL_DMGS=("$INTEL_BUNDLE"/dmg/*.dmg)
          WINDOWS_INSTALLERS=("$BUNDLE"/nsis/*.exe)
          WINDOWS_SIGNATURES=("$BUNDLE"/nsis/*.exe.sig)
          if (( ${#ARM_TARS[@]} != 1 || ${#ARM_DMGS[@]} != 1 )); then
            echo "Expected exactly one Apple Silicon updater archive and DMG" >&2
            exit 1
          fi
          if (( ${#INTEL_TARS[@]} != 1 || ${#INTEL_DMGS[@]} != 1 )); then
            echo "Expected exactly one Intel updater archive and DMG" >&2
            exit 1
          fi
          if (( ${#WINDOWS_INSTALLERS[@]} != 1 || ${#WINDOWS_SIGNATURES[@]} != 1 )); then
            echo "Expected exactly one Windows installer and updater signature" >&2
            exit 1
          fi
          TAR="${ARM_TARS[0]}"
          SIG="${TAR}.sig"
          DMG="${ARM_DMGS[0]}"
          INTEL_TAR="${INTEL_TARS[0]}"
          INTEL_SIG="${INTEL_TAR}.sig"
          INTEL_DMG="${INTEL_DMGS[0]}"
          WINDOWS_INSTALLER="${WINDOWS_INSTALLERS[0]}"
          WINDOWS_SIGNATURE="${WINDOWS_SIGNATURES[0]}"
          DEBS=("$BUNDLE"/linux/*.deb)
          APPIMAGES=("$BUNDLE"/linux/*.AppImage)
          if (( ${#DEBS[@]} != 1 || ${#APPIMAGES[@]} != 1 )); then
            echo "Expected exactly one Debian package and AppImage" >&2
            exit 1
          fi
          DEB="${DEBS[0]}"
          APPIMAGE="${APPIMAGES[0]}"
          for artifact in "$DMG" "$TAR" "$SIG" "$INTEL_DMG" "$INTEL_TAR" "$INTEL_SIG" "$DEB" "$APPIMAGE" "$WINDOWS_INSTALLER" "$WINDOWS_SIGNATURE"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Missing release artifact: $artifact" >&2
              exit 1
            fi
          done

          RPMS=("$BUNDLE"/rpm/*.rpm)
          HOST_ARCHIVES=(build/host-packages/*.tar.gz build/host-packages/*.zip)
          if (( ${#RPMS[@]} != 1 || ${#HOST_ARCHIVES[@]} != 6 )); then
            echo "Expected one rpm and six host archives" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${RPMS[0]}" release-artifacts/
          for archive in "${HOST_ARCHIVES[@]}"; do
            test -f "$archive.sha256"
            cp "$archive" "$archive.sha256" release-artifacts/
          done
          cp "$DMG" release-artifacts/MonoCode.dmg
          cp "$TAR" release-artifacts/MonoCode.app.tar.gz
          cp "$SIG" release-artifacts/MonoCode.app.tar.gz.sig
          cp "$INTEL_DMG" release-artifacts/MonoCode_x64.dmg
          cp "$INTEL_TAR" release-artifacts/MonoCode_x64.app.tar.gz
          cp "$INTEL_SIG" release-artifacts/MonoCode_x64.app.tar.gz.sig
          cp "$DEB" release-artifacts/MonoCode_amd64.deb
          cp "$APPIMAGE" release-artifacts/MonoCode_amd64.AppImage
          cp "$WINDOWS_INSTALLER" release-artifacts/MonoCode_x64-setup.exe
          cp "$WINDOWS_SIGNATURE" release-artifacts/MonoCode_x64-setup.exe.sig

          BASE="https://github.com/kaceper11/monocode/releases/download/${GITHUB_REF_NAME}"

          VERSION="$VERSION" \
            ARM_SIG="release-artifacts/MonoCode.app.tar.gz.sig" \
            INTEL_SIG="release-artifacts/MonoCode_x64.app.tar.gz.sig" \
            INTEL_TAR_URL="$BASE/MonoCode_x64.app.tar.gz" \
            ARM_TAR_URL="$BASE/MonoCode.app.tar.gz" \
            WINDOWS_SIGNATURE="release-artifacts/MonoCode_x64-setup.exe.sig" \
            WINDOWS_INSTALLER_URL="$BASE/MonoCode_x64-setup.exe" \
            node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            "release-artifacts/latest.json",
            JSON.stringify(
              {
                version: process.env.VERSION,
                notes: `MonoCode ${process.env.VERSION}`,
                pub_date: new Date().toISOString(),
                platforms: {
                  "darwin-aarch64": {
                    signature: fs
                      .readFileSync(process.env.ARM_SIG, "utf8")
                      .trim(),
                    url: process.env.ARM_TAR_URL,
                  },
                  "darwin-x86_64": {
                    signature: fs
                      .readFileSync(process.env.INTEL_SIG, "utf8")
                      .trim(),
                    url: process.env.INTEL_TAR_URL,
                  },
                  "windows-x86_64": {
                    signature: fs
                      .readFileSync(process.env.WINDOWS_SIGNATURE, "utf8")
                      .trim(),
                    url: process.env.WINDOWS_INSTALLER_URL,
                  },
                },
              },
              null,
              2,
            ) + "\n",
          );
          NODE

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          RELEASE_FILES=(release-artifacts/*)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "MonoCode $VERSION" \
              --notes "See CHANGELOG.md for details. macOS uses Apple signing when its optional secrets are configured; the Windows installer is not Authenticode-signed."
          fi
          verify_release() {
            local expected_draft="$1"
            gh release view "$GITHUB_REF_NAME" --json isDraft,assets > "$RUNNER_TEMP/release-state.json"
            node - "$RUNNER_TEMP/release-state.json" "$expected_draft" "${RELEASE_FILES[@]}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (release.isDraft !== (process.argv[3] === "true")) {
            console.error("GitHub Release publication state is unexpected.");
            process.exit(1);
          }
          const names = new Set(release.assets.map((asset) => asset.name));
          for (const file of process.argv.slice(4)) {
            const name = path.basename(file);
            if (!names.has(name)) {
              console.error(`GitHub Release is missing ${name}.`);
              process.exit(1);
            }
          }
          NODE
          }
          IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" == true ]]; then
            # Draft assets can be replaced after an interrupted upload. A
            # published release is immutable, so only resume drafts.
            gh release upload "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" --clobber
            verify_release true
            gh release edit "$GITHUB_REF_NAME" --draft=false
          elif [[ "$IS_DRAFT" != false ]]; then
            echo "Unexpected GitHub Release state: $IS_DRAFT" >&2
            exit 1
          fi
          verify_release false

  linux:
    if: github.repository == 'kaceper11/monocode'
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      - name: Build Linux packages
        run: npm run build:linux

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected exactly one .deb and one AppImage" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${deb[0]}" "${appimage[0]}" release-artifacts/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  windows:
    if: github.repository == 'kaceper11/monocode'
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Write updater release config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          $endpoint = "https://github.com/kaceper11/monocode/releases/latest/download/latest.json"
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBKEY)) {
            throw "TAURI_UPDATER_PUBKEY is required"
          }
          $config = @{
            bundle = @{
              createUpdaterArtifacts = $true
            }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBKEY
                endpoints = @($endpoint)
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Stage Windows packages
        run: |
          $installers = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe")
          $signatures = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe.sig")
          if ($installers.Count -ne 1 -or $signatures.Count -ne 1) {
            throw "Expected exactly one NSIS installer and one updater signature"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          $artifacts = @($installers[0].FullName, $signatures[0].FullName)
          Copy-Item -Path $artifacts -Destination "release-artifacts/"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error

  host:
    if: github.repository == 'kaceper11/monocode'
    name: Standalone host packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package -- --all
        if: runner.os == 'Linux'
      - run: npm run host:package
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error


  linux-rpm:
    if: github.repository == 'kaceper11/monocode'
    name: Linux rpm package
    runs-on: ubuntu-latest
    # Build on EL 10 so the published rpm's glibc requirement matches the
    # oldest advertised target. Fedora 43 is newer and would install on EL 10
    # while failing to load.
    container: almalinux:10
    steps:
      # almalinux:10 ships no git, which actions/checkout otherwise has to work
      # around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Enterprise Linux system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - run: npm ci

      - name: Build rpm package
        run: npm run build:fedora

      - name: Install and stage the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, and the setup script has already
          # installed every -devel package, so assert the metadata directly.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          mkdir -p release-artifacts
          cp "${bundle[0]}" release-artifacts/

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-package
          path: release-artifacts/
          if-no-files-found: error
